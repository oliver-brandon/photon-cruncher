[project]
name = "photon-cruncher"
dynamic = ["version"]
description = "Fiber photometry analysis suite with MATLAB-faithful preprocessing."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy>=1.25",
    "scipy>=1.11",
    "pandas>=2.0",
    "PySide6>=6.6",
    "matplotlib>=3.8",
    "tdt>=0.7.3",
    "packaging>=24.0",
    "velopack==1.2.0",
]

[project.optional-dependencies]
macos = ["pyobjc"]
build = ["pyinstaller>=6.0"]

[project.scripts]
photon-cruncher = "photon_cruncher.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "photon_cruncher" = "." }
packages = [
    "photon_cruncher",
    "photon_cruncher.analysis",
    "photon_cruncher.export",
    "photon_cruncher.gui",
    "photon_cruncher.io",
    "photon_cruncher.processing",
    "photon_cruncher.tests",
]

[tool.setuptools.dynamic]
version = { attr = "photon_cruncher.version.__version__" }

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
