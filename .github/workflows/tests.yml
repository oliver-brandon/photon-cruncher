name: Regression tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      desktop_smoke:
        description: Capture and test the Windows desktop workspace
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install application dependencies
        run: python -m pip install -e ./photon_cruncher
      - name: Run regression suite
        run: |
          export MPLCONFIGDIR="$RUNNER_TEMP/photon-mpl"
          python -m unittest discover -s photon_cruncher/tests -t .
      - name: Check Python, JavaScript, and version metadata
        run: |
          python -m compileall -q photon_cruncher scripts
          node --check photon_cruncher/gui_aurora/static/js/app.js
          node --check photon_cruncher/gui_aurora/static/js/plots.js
          python scripts/version_metadata.py --check
      - name: Check patch whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE" HEAD
          elif [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$PUSH_BEFORE" HEAD
          else
            git show --format= --check HEAD
          fi
      - name: Exercise Windows desktop workspace
        timeout-minutes: 3
        if: github.event_name == 'workflow_dispatch' && inputs.desktop_smoke && matrix.os == 'windows-latest'
        env:
          QT_QPA_PLATFORM: windows
          PHOTON_CRUNCHER_DEV: '1'
        run: python scripts/smoke_aurora_desktop.py "$RUNNER_TEMP/aurora-desktop"
      - name: Upload desktop screenshots
        if: always() && github.event_name == 'workflow_dispatch' && inputs.desktop_smoke && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: aurora-windows-desktop
          path: ${{ runner.temp }}/aurora-desktop/*.png
          if-no-files-found: warn
          retention-days: 3
